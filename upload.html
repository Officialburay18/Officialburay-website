<div class="container">
<h1>OFFICIALBURAY LIVE</h1>
<p>Share your videos with the world.</p>

<input id="videoFile" type="file" accept="video/mp4,video/webm">
<div style="margin-top:20px">
  <button type="button" id="cameraButton">

  </bu
<div style="margin-top:20px">
  <button type="button" id="cameraButton">
    📷 OPEN CAMERA
  </button>

  <video id="cameraPreview"
    autoplay muted playsinline
    style="display:none;width:100%;margin-top:15px">
  </video>

  <button type="button" id="startRecording" style="display:none">
    🔴 START RECORDING
  </button>

  <button type="button" id="stopRecording" style="display:none">
    STOP RECORDING
  </button>

  <p id="recordingStatus"></p>

  <video id="recordedPreview"
    controls playsinline
    style="display:none;width:100%;margin-top:15px">
  </video>

  <button type="button" id="useRecording" style="display:none">
    USE THIS VIDEO
  </button>
</div>
<input id="title" type="text" placeholder="Video title">

<textarea id="caption" placeholder="Write your video caption..."></textarea>

<button id="uploadButton">UPLOAD VIDEO</button>

<p id="status">Choose a video to begin.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://zinbassxezlkipoiphgg.supabase.co";

// Replace this with the SAME publishable key already used in live.html.
// Never put a secret/service-role key here.
const SUPABASE_KEY = "sb_publishable__YCk0PKBL2dl7iHZhN6iCA_xP5_jOu5";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const uploadButton = document.getElementById("uploadButton");
const statusBox = document.getElementById("status");
const videoFileInput = document.getElementById("videoFile");
const cameraButton = document.getElementById("cameraButton");
const cameraPreview = document.getElementById("cameraPreview");
const startRecording = document.getElementById("startRecording");
const stopRecording = document.getElementById("stopRecording");
const recordedPreview = document.getElementById("recordedPreview");
const useRecording = document.getElementById("useRecording");
const recordingStatus = document.getElementById("recordingStatus");

let cameraStream = null;
let mediaRecorder = null;
let recordedChunks = [];
let recordedFile = null;

cameraButton.addEventListener("click", async () => {
  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error("Camera is not supported in this browser.");
    }

    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: true
    });

    cameraPreview.srcObject = cameraStream;
    cameraPreview.style.display = "block";
    startRecording.style.display = "block";
    cameraButton.style.display = "none";

    recordingStatus.textContent = "Camera is ready!";
  } catch (error) {
    recordingStatus.textContent =
      "Camera error: " + error.message;
  }
});

startRecording.addEventListener("click", () => {
  if (!window.MediaRecorder) {
    recordingStatus.textContent =
      "Video recording is not supported in this browser.";
    return;
  }

  recordedChunks = [];

  let options = {};

  if (MediaRecorder.isTypeSupported("video/webm;codecs=vp8,opus")) {
    options.mimeType = "video/webm;codecs=vp8,opus";
  } else if (MediaRecorder.isTypeSupported("video/webm")) {
    options.mimeType = "video/webm";
  }

  mediaRecorder = new MediaRecorder(cameraStream, options);

  mediaRecorder.ondataavailable = event => {
    if (event.data.size > 0) {
      recordedChunks.push(event.data);
    }
  };

  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, {
      type: mediaRecorder.mimeType || "video/webm"
    });

    const extension = blob.type.includes("mp4") ? "mp4" : "webm";

    recordedFile = new File(
      [blob],
      "OFFICIALBURAY_" + Date.now() + "." + extension,
      { type: blob.type }
    );

    recordedPreview.src = URL.createObjectURL(blob);
    recordedPreview.style.display = "block";
    useRecording.style.display = "block";

    recordingStatus.textContent = "Recording finished! Preview your video.";
    startRecording.style.display = "block";
  };

  mediaRecorder.start();

  startRecording.style.display = "none";
  stopRecording.style.display = "block";
  recordingStatus.textContent = "Recording...";
});

stopRecording.addEventListener("click", () => {
  if (mediaRecorder && mediaRecorder.state === "recording") {
    mediaRecorder.stop();
  }

  stopRecording.style.display = "none";

  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }

  cameraPreview.style.display = "none";
  cameraButton.style.display = "block";
});

useRecording.addEventListener("click", () => {
  if (!recordedFile) return;

  const transfer = new DataTransfer();
  transfer.items.add(recordedFile);
  videoFileInput.files = transfer.files;

  recordingStatus.textContent =
    "Video selected! Add your title and caption, then upload.";

  useRecording.style.display = "none";
});
uploadButton.addEventListener("click", async () => {
  const file = document.getElementById("videoFile").files[0];
  const title = document.getElementById("title").value.trim();
  const caption = document.getElementById("caption").value.trim();

  if (!file) {
    statusBox.textContent = "Please choose a video.";
    return;
  }

  if (!["video/mp4", "video/webm"].includes(file.type)) {
    statusBox.textContent = "Please choose an MP4 or WebM video.";
    return;
  }

  if (file.size > 50 * 1024 * 1024) {
    statusBox.textContent = "Video must be 50 MB or smaller.";
    return;
  }

  if (!title) {
    statusBox.textContent = "Please enter a video title.";
    return;
  }

  uploadButton.disabled = true;
  statusBox.textContent = "Checking your account...";

  try {
    const { data: authData, error: authError } =
      await supabaseClient.auth.getUser();

    if (authError || !authData.user) {
      throw new Error("Please log in before uploading.");
    }

    const user = authData.user;

    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const filePath = user.id + "/" + Date.now() + "_" + safeName;

    statusBox.textContent = "Uploading your video...";

    const { error: storageError } = await supabaseClient
      .storage
      .from("videos")
      .upload(filePath, file, {
        contentType: file.type,
        upsert: false
      });

    if (storageError) throw storageError;

    statusBox.textContent = "Saving video details...";

    const { error: databaseError } = await supabaseClient
      .from("Videos")
      .insert({
        user_id: user.id,
        title: title,
        caption: caption,
        file_path: filePath
      });

    if (databaseError) {
      await supabaseClient.storage.from("videos").remove([filePath]);
      throw databaseError;
    }

    statusBox.textContent = "Video uploaded successfully!";

    document.getElementById("videoFile").value = "";
    document.getElementById("title").value = "";
    document.getElementById("caption").value = "";

  } catch (error) {
    statusBox.textContent = "Upload failed: " + error.message;
  } finally {
    uploadButton.disabled = false;
  }
});
  
// OFFICIALBURAY LIVE VIDEO STUDIO

const editor = document.getElementById("videoEditor");
const editorPreview = document.getElementById("editorPreview");
const effectChoice = document.getElementById("effectChoice");
const overlayText = document.getElementById("overlayText");
const editorOverlay = document.getElementById("editorOverlay");
const textColor = document.getElementById("textColor");
const stickerButtons = document.querySelectorAll(".sticker");

function openVideoEditor(file) {
  if (!file) return;

  const videoURL = URL.createObjectURL(file);
  editorPreview.src = videoURL;
  editor.style.display = "block";
}

videoFileInput.addEventListener("change", function () {
  const file = this.files && this.files[0];
  openVideoEditor(file);
});

// Preview filters
const filterEffects = {
  none: "none",
  vintage: "sepia(0.5) contrast(1.1)",
  dreamy: "brightness(1.2) saturate(1.3)",
  cinematic: "contrast(1.3) saturate(0.8)",
  bw: "grayscale(1)",
  warm: "sepia(0.25) saturate(1.3)",
  studio: "brightness(1.1) contrast(1.1)",
  bigmouth: "none",
  bigbody: "none"
};

effectChoice.addEventListener("change", function () {
  editorPreview.style.filter =
    filterEffects[this.value] || "none";
});

// Text overlay
overlayText.addEventListener("input", function () {
  editorOverlay.textContent = this.value;
});

textColor.addEventListener("input", function () {
  editorOverlay.style.color = this.value;
});

// Stickers
stickerButtons.forEach(function (button) {
  button.addEventListener("click", function () {
    editorOverlay.textContent += " " + this.textContent;
  });
});

// Preview a selected trim start time
document.getElementById("trimStart").addEventListener("change", function () {
  const start = Math.max(0, Number(this.value) || 0);
  if (Number.isFinite(editorPreview.duration)) {
    editorPreview.currentTime = Math.min(start, editorPreview.duration);
  }
});

// Also show a recorded video in the editor
useRecording.addEventListener("click", function () {
  if (recordedFile) {
    openVideoEditor(recordedFile);
  }
});
